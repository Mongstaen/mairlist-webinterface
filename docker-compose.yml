services:
  mairlist-webinterface:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REPO_URL: https://github.com/Mongstaen/mairlist-webinterface.git
        REPO_REF: main
    image: mairlist-webinterface:latest
    container_name: mairlist-webinterface
    restart: unless-stopped
    ports:
      - "8841:8841"
    env_file:
      - server/.env
    environment:
      # Point the app at the persisted volume below. Override DATA_SOURCE
      # in server/.env if you use DATA_SOURCE=api instead (no DB_PATH needed).
      DB_PATH: /data/mairlist.mldb
      UPLOAD_BASE_DIR: /data/uploads
    volumes:
      - mairlist-data:/data

volumes:
  mairlist-data:
